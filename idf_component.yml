# Manifest for the ESP Component Registry.
version: "0.1.0"
description: >-
  Raspberry Pi DSI touch display (and clones such as the 5" OSOYOO) on the ESP32-P4:
  800x480 RGB888 over one MIPI DSI lane through a TC358762-compatible bridge, with an
  ATTINY-compatible controller doing power sequencing and backlight, and FT5x06 touch.
  Brings the whole display up in one call and hands back an esp_lcd panel handle.
license: "GPL-2.0-only"

url: "https://github.com/kurozz/esp_lcd_rpi_dsi"

# The component sits at the root of its own repository, so no repository_info.path
repository: "https://github.com/kurozz/esp_lcd_rpi_dsi.git"

issues: "https://github.com/kurozz/esp_lcd_rpi_dsi/issues"

maintainers:
  - "Kuro <kurozz@protonmail.com>"

tags:
  - lcd
  - display
  - mipi-dsi
  - dsi
  - raspberry-pi
  - tc358762
  - touch
  - ft5x06

targets:
  - esp32p4

dependencies:
  # The DSI HAL comes from esp_hal_lcd on v6.0 and newer, and from `hal` on v5.5
  # (CMakeLists.txt picks the right one). Run on v5.5.4; earlier 5.x not tried.
  idf: ">=5.5"
  # The touch controller is an ordinary FT5x06; no reason to reimplement it
  espressif/esp_lcd_touch_ft5x06: "^1.0.6"

files:
  exclude:
    - "**/build/**"
    - "**/sdkconfig"
    - "**/sdkconfig.old"
    - "**/managed_components/**"
    - "**/dependencies.lock"
    - ".github/**"
